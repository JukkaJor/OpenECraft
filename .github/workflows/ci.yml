name: CI

on:
  push:
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --release
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-${{ matrix.os }}
          path: |
            target/release/openecraft
            target/release/openecraft.exe
            target/release/openecraft-parts-server
            target/release/openecraft-parts-server.exe
            target/release/openecraft-parts-manager
            target/release/openecraft-parts-manager.exe
            target/release/openecraft-project-server
            target/release/openecraft-project-server.exe
            target/release/openecraft-cli
            target/release/openecraft-cli.exe

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - run: powershell -ExecutionPolicy Bypass -File installer\windows\build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-windows-installer
          path: target/installer/*.exe

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install trunk --locked
      - run: cargo clippy -p openecraft -p openecraft-parts-manager --target wasm32-unknown-unknown -- -D warnings
      - run: trunk build --release
      - run: trunk build --release
        working-directory: parts-manager
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-web
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: openecraft-parts-manager-web
          path: parts-manager/dist
