[package]
name = "openecraft-project-server"
version = "0.1.0"
edition = "2021"
description = "Project server for OpenECraft: shared projects with page locks for several users"
license = "MIT OR Apache-2.0"

[[bin]]
name = "openecraft-project-server"
path = "src/main.rs"

[dependencies]
openecraft-core = { path = "../crates/openecraft-core" }
openecraft-parts = { path = "../crates/openecraft-parts" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
