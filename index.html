<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>OpenECraft</title>
    <link data-trunk rel="rust" data-bin="openecraft" data-wasm-opt="2" />
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #1b1c1f; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                   color: #ddd; font-family: sans-serif; font-size: 18px; text-align: center; }
    </style>
</head>
<body>
    <canvas id="openecraft_canvas"></canvas>
    <div id="loading">Loading OpenECraft…</div>
</body>
</html>
