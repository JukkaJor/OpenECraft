[package]
name = "openecraft"
version = "0.1.0"
edition = "2021"
description = "OpenECraft - an open electrical CAE (schematic) editor in the spirit of EPLAN Electric P8"
license = "MIT OR Apache-2.0"

[[bin]]
name = "openecraft"
path = "src/main.rs"

[workspace]
members = [".", "crates/openecraft-parts", "server"]

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
# Bundle the symbol / emoji fonts: native builds have no browser font fallback,
# so icons used in the UI must be in the bundled fonts (see src/glyphs.rs).
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rfd = "0.17"
ehttp = "0.7"
openecraft-parts = { path = "crates/openecraft-parts" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "File",
    "FileList",
    "FileReader",
    "Event",
] }

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
