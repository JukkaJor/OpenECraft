[package]
name = "openecraft-step"
version = "0.1.0"
edition = "2021"
description = "STEP import of OpenECraft: B-rep models of STEP files (ISO 10303-21) tessellated into part meshes"
license = "MIT OR Apache-2.0"

[dependencies]
openecraft-parts = { path = "../openecraft-parts" }
monstertruck-assembly = "0.4"
monstertruck-io = "0.4"
monstertruck-meshing = "0.4"
monstertruck-topology = "0.4"

[dev-dependencies]
monstertruck-modeling = "0.4"
