[package]
name = "openecraft-step"
version = "0.1.0"
edition = "2021"
description = "STEP / IGES import of OpenECraft: B-rep models of STEP (ISO 10303-21), IGES 5.3 and Parasolid XT files tessellated into part meshes"
license = "MIT OR Apache-2.0"

[dependencies]
openecraft-parts = { path = "../openecraft-parts" }
# STEP is read through the `cadmpeg` backend, not monstertruck's own `step` reader.
monstertruck-io = { version = "0.4", default-features = false, features = ["iges"] }
cadmpeg-codec-iges = "0.4"
cadmpeg-ir = "0.4"
monstertruck-meshing = "0.4"
monstertruck-topology = "0.4"
monstertruck-modeling = "0.4"
parasolid-core = "0.3.7"

[dev-dependencies]
openecraft-core = { path = "../openecraft-core" }
openecraft-xt = { path = "../openecraft-xt" }
