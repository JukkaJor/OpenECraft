[package]
name = "openecraft-step"
version = "0.1.0"
edition = "2021"
description = "STEP / IGES import of OpenECraft: B-rep models of STEP (ISO 10303-21) and IGES 5.3 files tessellated into part meshes"
license = "MIT OR Apache-2.0"

[dependencies]
openecraft-parts = { path = "../openecraft-parts" }
monstertruck-assembly = "0.4"
monstertruck-io = { version = "0.4", features = ["iges"] }
cadmpeg-codec-iges = "0.4"
cadmpeg-ir = "0.4"
monstertruck-meshing = "0.4"
monstertruck-topology = "0.4"

[dev-dependencies]
monstertruck-modeling = "0.4"
openecraft-core = { path = "../openecraft-core" }
