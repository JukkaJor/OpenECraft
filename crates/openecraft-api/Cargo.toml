[package]
name = "openecraft-api"
version = "0.1.0"
edition = "2021"
description = "Extension API of OpenECraft: plugins add commands, checks, reports and exports to the editor, the command line and the MCP server"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openecraft-core = { path = "../openecraft-core" }
openecraft-i18n = { path = "../openecraft-i18n" }
