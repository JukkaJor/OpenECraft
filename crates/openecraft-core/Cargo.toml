[package]
name = "openecraft-core"
version = "0.1.0"
edition = "2021"
description = "Headless project model of OpenECraft (pages, devices, checks, reports, SVG / PDF / DXF export)"
license = "MIT OR Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
openecraft-parts = { path = "../openecraft-parts" }
openecraft-i18n = { path = "../openecraft-i18n" }
