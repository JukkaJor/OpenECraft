[package]
name = "openecraft-auth"
version.workspace = true
edition = "2021"
description = "Access control of the OpenECraft servers: password hashes (Argon2), session tokens, throttled sign-in, Active Directory / LDAP sign-in, access settings, configuration files, JSON errors"
license = "MIT OR Apache-2.0"

[dependencies]
openecraft-parts = { path = "../openecraft-parts" }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
sha2 = "0.10"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
log = "0.4"
axum = "0.8"
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
